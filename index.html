function cycleHistoryRow(l){
  const tags = [];
  if(l.flow && l.flow !== 'none') tags.push(l.flow);
  SYMPTOM_FIELDS.forEach(s => { if(l[s.key]) tags.push(s.label); });
  return `<div class="cycle-history-row"><span>${l.date}</span><span class="cycle-tags">${tags.map(t=>`<span>${esc(t)}</span>`).join('')}</span></div>`;
}

async function renderCorrelation(cycleLogs){
  const body = $('#correlation-body');
  if(!body) return;
  const uid = session.user.id;
  const symptomDays = cycleLogs.filter(l => l.breast_pain || l.cramps || l.bloating || l.headache).map(l => l.date);
  if(symptomDays.length < 3){
    body.innerHTML = `<p class="muted">Log symptoms on at least a few days and I'll start comparing what you were eating on those days versus your clearer days.</p>`;
    return;
  }
  const earliestDate = cycleLogs[0]?.date || todayStr();
  if(!flagsCache) flagsCache = await supa('/rest/v1/inflammatory_flags?select=*');
  const foodLogs = await supa(`/rest/v1/food_logs?user_id=eq.${uid}&date=gte.${earliestDate}&select=*`);

  const flagCountByDate = {};
  foodLogs.forEach(l => {
    const text = `${l.food_name||''} ${l.ingredients_raw||''}`.toLowerCase();
    let count = 0;
    flagsCache.forEach(f => { if(text.includes(f.keyword.toLowerCase())) count++; });
    flagCountByDate[l.date] = (flagCountByDate[l.date]||0) + count;
  });

  const allDatesLogged = Object.keys(flagCountByDate);
  const symptomSet = new Set(symptomDays);
  const onDays = allDatesLogged.filter(d => symptomSet.has(d));
  const offDays = allDatesLogged.filter(d => !symptomSet.has(d));
  const avg = arr => arr.length ? arr.reduce((a,d)=>a+flagCountByDate[d],0)/arr.length : 0;
  const avgOn = avg(onDays), avgOff = avg(offDays);

  if(onDays.length === 0 || offDays.length === 0){
    body.innerHTML = `<p class="muted">Once you have food logged on both symptom days and clearer days, I'll compare inflammatory flags between them.</p>`;
    return;
  }
  const maxVal = Math.max(avgOn, avgOff, 1);
  body.innerHTML = `
    <p class="muted">Average inflammatory food flags per day, symptom days vs. clearer days (based on ${onDays.length} symptom day${onDays.length===1?'':'s'} and ${offDays.length} clearer day${offDays.length===1?'':'s'} with food logged):</p>
    <div class="correlation-bar-row">
      <div class="correlation-label"><span>Symptom days</span><b>${avgOn.toFixed(1)}</b></div>
      <div class="flag-bar-track"><div class="flag-bar-fill" style="width:${(avgOn/maxVal)*100}%;background:var(--rust);"></div></div>
    </div>
    <div class="correlation-bar-row">
      <div class="correlation-label"><span>Clearer days</span><b>${avgOff.toFixed(1)}</b></div>
      <div class="flag-bar-track"><div class="flag-bar-fill" style="width:${(avgOff/maxVal)*100}%;background:var(--sage-500);"></div></div>
    </div>
    <p class="muted" style="margin-top:10px;">${avgOn > avgOff*1.2 ? "There's a noticeable pattern — you tend to eat more flagged foods on symptom days. Worth mentioning to your doctor alongside your anti-inflammatory diet." : "No strong pattern yet — keep logging and this will get more reliable over time."} This is observational, not a diagnosis.</p>
  `;
}
async function renderHabits(panel){
  const uid = session.user.id;
  const weekAgo = new Date(Date.now() - 6*86400000).toISOString().slice(0,10);
  const [habits, weekLogs, reminders] = await Promise.all([
    supa(`/rest/v1/habits?user_id=eq.${uid}&order=created_at.asc&select=*`),
    supa(`/rest/v1/habit_logs?user_id=eq.${uid}&date=gte.${weekAgo}&completed=eq.true&select=habit_id,date`),
    supa(`/rest/v1/habit_reminders?user_id=eq.${uid}&select=*`)
  ]);
  const activeHabits = habits.filter(h=>h.active);
  const countByHabit = {};
  weekLogs.forEach(l => countByHabit[l.habit_id] = (countByHabit[l.habit_id]||0) + 1);
  const remByHabit = {};
  reminders.forEach(r => remByHabit[r.habit_id] = r);
  const pushStatus = await getPushSubscriptionStatus();

  panel.innerHTML = `
    <div class="card">
      <h2 class="section-title">Reminders on this device</h2>
      <p class="push-status">${pushStatus==='on' ? "Notifications are enabled on this device." : pushStatus==='unsupported' ? "This browser doesn't support push notifications." : "Turn this on to get reminders for habits you flag below."}</p>
      ${pushStatus!=='unsupported' ? `<button class="btn btn-ghost" id="push-toggle" style="width:auto;padding:9px 20px;margin-top:8px;">${pushStatus==='on' ? 'Turn off notifications' : 'Enable notifications'}</button>` : ''}
    </div>
    <div class="card">
      <h2 class="section-title">Add a habit</h2>
      <div class="row">
        <div class="field" style="flex:2;min-width:180px;"><label>Habit name</label><input type="text" id="h-name" placeholder="e.g. Take supplements"></div>
        <div class="field" style="min-width:140px;"><label>Times per week</label><input type="number" id="h-freq" value="7" min="1" max="7"></div>
      </div>
      <button class="btn btn-primary" id="add-habit" style="width:auto;padding:11px 26px;">Add habit</button>
    </div>
    <div class="card">
      <h2 class="section-title">This week's performance</h2>
      <div class="habit-perf">
        ${activeHabits.length ? activeHabits.map(h => {
          const done = countByHabit[h.id] || 0;
          const pct = Math.min(100, Math.round((done/h.target_frequency)*100));
          return `<div class="habit-perf-row">
            <div class="habit-perf-top"><span>${esc(h.name)}</span><span class="muted">${done} / ${h.target_frequency} this week</span></div>
            <div class="habit-perf-track"><div class="habit-perf-fill" style="width:${pct}%;"></div></div>
          </div>`;
        }).join('') : `<p class="empty-state">Add a habit below to start tracking performance.</p>`}
      </div>
    </div>
    <div class="card">
      <h2 class="section-title">Your habits</h2>
      ${activeHabits.length ? activeHabits.map(h => `
        <div class="habit-item" style="flex-direction:column;align-items:stretch;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div><div class="habit-name">${esc(h.name)}</div><div class="habit-freq">${h.target_frequency}x / week</div></div>
            <button class="small-btn del-habit" data-id="${h.id}">Remove</button>
          </div>
          ${habitReminderBlock(h, remByHabit[h.id])}
        </div>
      `).join('') : `<p class="empty-state">No habits yet.</p>`}
    </div>
  `;

  const pushBtn = $('#push-toggle');
  if(pushBtn) pushBtn.onclick = async () => {
    pushBtn.disabled = true; pushBtn.textContent = 'Working…';
    if(pushStatus==='on') await disablePush(); else await enablePush();
    renderHabits(panel);
  };

  $('#add-habit').onclick = async () => {
    const name = $('#h-name').value.trim();
    if(!name) return;
    const freq = parseInt($('#h-freq').value)||7;
    await supa('/rest/v1/habits', {method:'POST', headers:{Prefer:'return=representation'}, body: JSON.stringify({user_id:uid, name, target_frequency:freq, active:true})});
    renderHabits(panel);
  };
  panel.querySelectorAll('.del-habit').forEach(b => b.onclick = async () => {
    await supa(`/rest/v1/habits?id=eq.${b.dataset.id}`, {method:'PATCH', body: JSON.stringify({active:false})});
    renderHabits(panel);
  });

  // reminder controls per habit
  activeHabits.forEach(h => {
    const toggleBtn = panel.querySelector(`.reminder-toggle[data-habit="${h.id}"]`);
    const detail = panel.querySelector(`.reminder-detail[data-habit-detail="${h.id}"]`);
    if(!toggleBtn) return;
    toggleBtn.onclick = async () => {
      const rem = remByHabit[h.id];
      if(rem && rem.enabled){
        await supa(`/rest/v1/habit_reminders?habit_id=eq.${h.id}`, {method:'PATCH', body: JSON.stringify({enabled:false})});
        renderHabits(panel);
      } else {
        detail.style.display = detail.style.display==='none' ? 'flex' : 'none';
      }
    };
    detail?.querySelectorAll('.day-pill').forEach(p => p.onclick = () => p.classList.toggle('on'));
    const saveBtn = detail?.querySelector('.save-reminder');
    if(saveBtn) saveBtn.onclick = async () => {
      const days = Array.from(detail.querySelectorAll('.day-pill.on')).map(p => parseInt(p.dataset.day));
      const time = detail.querySelector('.reminder-time').value || '08:00';
      if(days.length === 0){ alert('Pick at least one day.'); return; }
      await supa(`/rest/v1/habit_reminders?on_conflict=habit_id`, {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=representation'}, body: JSON.stringify({
        user_id: uid, habit_id: h.id, enabled: true, days_of_week: days, reminder_time: time + ':00'
      })});
      renderHabits(panel);
    };
  });
}
function habitReminderBlock(h, rem){
  const days = rem?.days_of_week || [];
  const time = rem?.reminder_time ? rem.reminder_time.slice(0,5) : '08:00';
  const enabled = !!(rem && rem.enabled);
  return `
    <div class="reminder-block">
      <button class="reminder-toggle ${enabled?'on':''}" data-habit="${h.id}">${enabled ? `Reminder: ${DOW_LABELS(days)} at ${time}` : 'Add reminder'}</button>
      <div class="reminder-detail" data-habit-detail="${h.id}" style="display:none;">
        <div class="day-pills">
          ${['Su','Mo','Tu','We','Th','Fr','Sa'].map((d,i)=>`<button class="day-pill ${days.includes(i)?'on':''}" data-day="${i}">${d}</button>`).join('')}
        </div>
        <input type="time" class="reminder-time" value="${time}">
        <button class="btn-ghost save-reminder" style="padding:6px 12px;font-size:12px;">Save</button>
      </div>
    </div>
  `;
}
function DOW_LABELS(days){
  const names = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  return days.map(d=>names[d]).join('');
}

// ---------- SCRIPTURE ----------
const DECLARATIONS = {
  'body as temple': "I honor my body today as something sacred, not something to punish.",
  'strength': "I am stronger than I feel right now. Today I choose to keep going.",
  'health': "My body is healing and I am building a life of health, one day at a time.",
  'identity': "I am fearfully and wonderfully made — my worth isn't measured by a number on a scale.",
  'stewardship': "Every choice I make today is an offering, cared for on purpose.",
  'renewal': "Today is a fresh start. My best days are still ahead of me.",
  'perseverance': "I don't have to be perfect today — I just have to keep showing up.",
  'peace': "I release anxiety about my progress and trust the process I'm in.",
  'healing': "My body knows how to heal, and I'm giving it what it needs to do that.",
};
async function renderScripture(panel){
  const scriptures = await supa('/rest/v1/scriptures?order=display_order.asc&select=*');
  if(!scriptures.length){ panel.innerHTML = `<p class="empty-state">No scriptures loaded yet.</p>`; return; }
  const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(),0,0)) / 86400000);
  await showVerse(scriptures[dayOfYear % scriptures.length], scriptures);

  async function showVerse(entry, list){
    panel.innerHTML = `<div class="card scripture-card">${leafSvg('var(--gold)',22)}<p class="muted">Loading today's verse…</p></div>`;
    let text = entry.verse_text, ref = entry.reference;
    try{
      const res = await fetch(`https://bible-api.com/${encodeURIComponent(entry.reference)}?translation=web`);
      const data = await res.json();
      if(data && data.text){ text = data.text.trim(); ref = data.reference || entry.reference; }
    }catch(e){ /* fall back to stored text if API is unreachable */ }
    const declaration = DECLARATIONS[entry.theme] || '';
    panel.innerHTML = `
      <div class="card scripture-card">
        ${leafSvg('var(--gold)',22)}
        <p class="scripture-text">"${esc(text)}"</p>
        <p class="scripture-ref">${esc(ref)}</p>
        ${declaration ? `<p class="declaration">${esc(declaration)}</p>` : ''}
        <button class="refresh-verse" id="shuffle-verse">Show me another</button>
      </div>
    `;
    $('#shuffle-verse').onclick = () => {
      const other = list[Math.floor(Math.random()*list.length)];
      showVerse(other, list);
    };
  }
}

init();
</script>
