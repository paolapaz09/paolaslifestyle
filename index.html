<style>
  :root{
    --sage-50:#F6F7F1;
    --sage-100:#E9EDE1;
    --sage-200:#D6DECB;
    --sage-300:#B7C4A7;
    --sage-500:#7C9473;
    --sage-600:#647A5C;
    --sage-700:#465241;
    --cream:#FBFAF5;
    --ink:#2B2F27;
    --ink-soft:#5C6355;
    --gold:#B99B5B;
    --rust:#B5674B;
    --line:#DDE3D3;
    --radius:14px;
    --shadow:0 2px 10px rgba(70,82,65,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--sage-50);
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  #root{max-width:900px;margin:0 auto;padding:20px 16px 60px;}

  /* --- header --- */
  .app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand h1{font-size:22px;font-weight:600;color:var(--sage-700);margin:0;letter-spacing:0.2px;}
  .leaf-icon svg{display:block;}
  .signout{background:none;border:1px solid var(--line);color:var(--ink-soft);font-size:13px;padding:7px 14px;border-radius:20px;}
  .signout:hover{background:var(--sage-100);}

  /* --- auth --- */
  .auth-wrap{max-width:380px;margin:60px auto;text-align:center;}
  .auth-wrap h1{font-size:30px;color:var(--sage-700);margin-bottom:4px;}
  .auth-sub{color:var(--ink-soft);font-size:14px;margin-bottom:28px;}
  .card{background:var(--cream);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);}
  .field{margin-bottom:14px;text-align:left;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;}
  input,select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
    font-size:14px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--sage-300);border-color:var(--sage-500);}
  .btn{border:none;border-radius:24px;padding:11px 20px;font-size:14px;font-weight:600;}
  .btn-primary{background:var(--sage-600);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--sage-700);}
  .btn-ghost{background:none;border:1px solid var(--line);color:var(--sage-700);}
  .btn-ghost:hover{background:var(--sage-100);}
  .switch-link{margin-top:14px;font-size:13px;color:var(--ink-soft);}
  .switch-link a{color:var(--sage-600);cursor:pointer;text-decoration:underline;}
  .auth-error{color:var(--rust);font-size:13px;margin-top:10px;}

  /* --- tabs --- */
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:22px;padding-bottom:2px;}
  .tab-btn{background:none;border:none;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--ink-soft);border-radius:20px;white-space:nowrap;}
  .tab-btn.active{background:var(--sage-600);color:#fff;}
  .tab-btn:not(.active):hover{background:var(--sage-100);color:var(--sage-700);}

  section.panel{display:flex;flex-direction:column;gap:18px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > .card{flex:1;min-width:220px;}
  .section-title{font-size:17px;color:var(--sage-700);margin:0 0 12px;font-weight:600;}
  .muted{color:var(--ink-soft);font-size:13px;}

  /* leaf divider */
  .sprig{display:flex;align-items:center;gap:8px;margin:4px 0 16px;color:var(--sage-300);}
  .sprig svg{flex-shrink:0;}
  .sprig .line{flex:1;height:1px;background:var(--line);}

  /* habit checklist */
  .habit-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);}
  .habit-item:last-child{border-bottom:none;}
  .habit-check{display:flex;align-items:center;gap:10px;}
  .checkbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--sage-300);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .checkbox.done{background:var(--sage-500);border-color:var(--sage-500);}
  .checkbox.done svg{stroke:#fff;}
  .habit-name{font-size:14px;}
  .habit-freq{font-size:11px;color:var(--ink-soft);}
  .small-btn{background:none;border:none;color:var(--rust);font-size:12px;}

  /* food log */
  .food-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;}
  .food-row:last-child{border-bottom:none;}
  .food-name{font-size:14px;font-weight:600;}
  .food-macros{font-size:12px;color:var(--ink-soft);}
  .macro-pill{display:inline-block;background:var(--sage-100);color:var(--sage-700);border-radius:12px;padding:2px 9px;font-size:11px;margin-right:5px;}
  .totals-bar{display:flex;gap:16px;background:var(--sage-100);border-radius:10px;padding:12px 16px;margin-top:6px;flex-wrap:wrap;}
  .totals-bar .t{font-size:12px;color:var(--sage-700);}
  .totals-bar .t b{font-size:16px;display:block;font-family:'Fraunces',serif;}

  .search-results{max-height:220px;overflow-y:auto;margin-top:8px;}
  .search-result{padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid var(--line);margin-bottom:6px;}
  .search-result:hover{background:var(--sage-100);}

  #reader{width:100%;max-width:340px;margin:10px auto;border-radius:10px;overflow:hidden;}

  /* progress */
  .stem-wrap{margin:18px 0 6px;}
  .stem-track{position:relative;height:10px;background:var(--sage-100);border-radius:6px;}
  .stem-fill{position:absolute;left:0;top:0;height:10px;background:linear-gradient(90deg,var(--sage-300),var(--sage-600));border-radius:6px;}
  .stem-leaf{position:absolute;top:-11px;transform:translateX(-50%);}
  .stem-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:6px;}
  .weight-now{font-size:34px;font-family:'Fraunces',serif;color:var(--sage-700);}
  .weight-goal{font-size:13px;color:var(--ink-soft);}

  svg.chart{width:100%;height:180px;}

  /* inflammatory */
  .flag-cat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);}
  .flag-cat:last-child{border-bottom:none;}
  .flag-bar-track{background:var(--sage-100);border-radius:6px;height:8px;flex:1;margin:0 12px;overflow:hidden;}
  .flag-bar-fill{height:8px;background:var(--rust);border-radius:6px;}
  .flag-count{font-size:13px;font-weight:600;width:20px;text-align:right;}

  /* scripture */
  .scripture-card{background:linear-gradient(180deg,var(--cream),var(--sage-50));text-align:center;padding:36px 26px;position:relative;}
  .scripture-text{font-family:'Fraunces',serif;font-size:19px;line-height:1.55;color:var(--sage-700);font-weight:400;font-style:italic;}
  .scripture-ref{margin-top:14px;font-size:13px;color:var(--gold);font-weight:600;letter-spacing:0.4px;text-transform:uppercase;}

  .empty-state{text-align:center;color:var(--ink-soft);font-size:13px;padding:20px 0;}
  .donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:6px;}
  .donut-legend{display:flex;flex-direction:column;gap:8px;}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:13px;}
  .legend-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
  .habit-perf{margin-top:6px;}
  .habit-perf-row{margin-bottom:12px;}
  .habit-perf-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .habit-perf-track{background:var(--sage-100);border-radius:6px;height:8px;overflow:hidden;}
  .habit-perf-fill{background:var(--sage-500);height:8px;border-radius:6px;}
  .qty-row{display:flex;align-items:center;gap:8px;}
  .qty-row input{width:80px;}
  .serving-note{font-size:12px;color:var(--ink-soft);margin:-6px 0 12px;}
  .refresh-verse{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:18px;padding:6px 16px;font-size:12px;font-weight:600;margin-top:16px;}
  .refresh-verse:hover{background:var(--gold);color:#fff;}
  .declaration{font-size:13px;color:var(--ink-soft);margin-top:12px;font-style:normal;padding-top:12px;border-top:1px solid var(--line);}
  .date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .date-nav-btn{background:var(--sage-100);border:none;color:var(--sage-700);width:34px;height:34px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .date-nav-btn:hover{background:var(--sage-200);}
  .date-nav-btn:disabled{opacity:0.35;cursor:default;}
  .date-nav-label{text-align:center;}
  .date-nav-label .big{font-family:'Fraunces',serif;font-size:17px;color:var(--sage-700);}
  .date-nav-label .small{font-size:11px;color:var(--ink-soft);}
  .jump-today{background:none;border:none;color:var(--sage-600);font-size:12px;text-decoration:underline;margin-top:2px;}
  .add-toggle.active{background:var(--sage-600);color:#fff;}
  .journal-entry{padding:12px 0;border-bottom:1px solid var(--line);}
  .journal-entry:last-child{border-bottom:none;}
  .journal-date{font-size:12px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:0.3px;}
  .journal-text{font-size:14px;margin-top:4px;line-height:1.5;}
  .cycle-day-badge{width:110px;height:110px;border-radius:50%;background:linear-gradient(145deg,var(--sage-500),var(--sage-700));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 14px;}
  .cycle-day-badge .num{font-family:'Fraunces',serif;font-size:36px;line-height:1;}
  .cycle-day-badge .lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;opacity:0.9;}
  .cycle-stats{display:flex;justify-content:center;gap:26px;text-align:center;margin-top:6px;flex-wrap:wrap;}
  .cycle-stats .cs{font-size:12px;color:var(--ink-soft);}
  .cycle-stats .cs b{display:block;font-family:'Fraunces',serif;font-size:18px;color:var(--sage-700);}
  .symptom-grid{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;}
  .symptom-toggle{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 14px;font-size:12.5px;}
  .symptom-toggle.on{background:var(--rust);color:#fff;border-color:var(--rust);}
  .flow-choice{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .flow-choice button{flex:1;min-width:70px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 6px;font-size:12px;}
  .flow-choice button.on{background:var(--sage-600);color:#fff;border-color:var(--sage-600);}
  .cycle-history-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .cycle-history-row:last-child{border-bottom:none;}
  .cycle-tags span{background:var(--sage-100);color:var(--sage-700);border-radius:10px;padding:2px 8px;font-size:11px;margin-left:4px;}
  .correlation-bar-row{margin-bottom:14px;}
  .correlation-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .reminder-block{margin-top:8px;padding-top:8px;}
  .reminder-toggle{background:var(--sage-100);border:none;color:var(--sage-700);border-radius:16px;padding:5px 12px;font-size:11.5px;font-weight:600;}
  .reminder-toggle.on{background:var(--gold);color:#fff;}
  .reminder-detail{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .day-pills{display:flex;gap:4px;}
  .day-pill{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:11px;padding:0;}
  .day-pill.on{background:var(--sage-600);color:#fff;border-color:var(--sage-600);}
  .reminder-time{width:110px;}
  .push-status{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
  .weather-hero{text-align:center;padding:10px 0 4px;}
  .weather-temp{font-family:'Fraunces',serif;font-size:52px;color:var(--sage-700);line-height:1;}
  .weather-desc{color:var(--ink-soft);font-size:14px;margin-top:4px;}
  .weather-sub{display:flex;justify-content:center;gap:22px;margin-top:14px;flex-wrap:wrap;}
  .weather-sub .ws{font-size:12px;color:var(--ink-soft);text-align:center;}
  .weather-sub .ws b{display:block;font-family:'Fraunces',serif;font-size:17px;color:var(--sage-700);}
  .aqi-badge{display:inline-block;padding:10px 22px;border-radius:24px;color:#fff;font-family:'Fraunces',serif;font-size:22px;margin:8px 0;}
  .aqi-label{font-size:12px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);}
  .pollutant-grid{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;}
  .pollutant-item{flex:1;min-width:90px;text-align:center;background:var(--sage-50);border-radius:10px;padding:10px 6px;}
  .pollutant-item b{display:block;font-family:'Fraunces',serif;font-size:16px;color:var(--sage-700);}
  .pollutant-item span{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;}
  .zip-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:16px;}
  .zip-row .field{margin-bottom:0;flex:1;max-width:140px;}
  .add-toggle{background:var(--sage-100);color:var(--sage-700);border:none;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;}
  .add-toggle:hover{background:var(--sage-200);}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .tag-choice{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .tag-choice button{padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:12px;}
  .tag-choice button.active{background:var(--sage-600);color:#fff;border-color:var(--sage-600);}
  @media(max-width:520px){
    .row > .card{min-width:100%;}
  }
</style>

<div id="root"></div>

<script>
const SUPABASE_URL = 'https://gcpeomazdqtuakjnhwqo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_y9qqZBC3b8vNQb2rFvUduw_UD1XdJ1F';
const USDA_KEY = '5QilVVA6mgtzzUPMCpmop9eA1z6Z1miU2IXFk1xX';
const VAPID_PUBLIC_KEY = 'BHU1AmJlG4RX6uvM1Sf3hqTdFL6snk3ZRiZzcEnCD3d38QOaoJmhuKMH60WEFcJWO_MXAzU4ANBj6o8uQ4sI5ss';

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData = atob(base64);
  const arr = new Uint8Array(rawData.length);
  for(let i=0;i<rawData.length;i++) arr[i] = rawData.charCodeAt(i);
  return arr;
}

async function getPushSubscriptionStatus(){
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported';
    const reg = await navigator.serviceWorker.getRegistration();
    if(!reg) return 'off';
    const sub = await reg.pushManager.getSubscription();
    return sub ? 'on' : 'off';
  }catch(e){ return 'off'; }
}

async function enablePush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    alert("This browser doesn't support push notifications.");
    return false;
  }
  try{
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ alert('Notification permission was not granted — check your browser/site settings.'); return false; }
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    }
    const j = sub.toJSON();
    await supa('/rest/v1/push_subscriptions?on_conflict=endpoint', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=representation'}, body: JSON.stringify({
      user_id: session.user.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth
    })});
    return true;
  }catch(e){
    alert('Could not enable notifications: ' + e.message);
    return false;
  }
}
async function disablePush(){
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    if(reg){
      const sub = await reg.pushManager.getSubscription();
      if(sub){
        await supa(`/rest/v1/push_subscriptions?endpoint=eq.${encodeURIComponent(sub.endpoint)}`, {method:'DELETE'});
        await sub.unsubscribe();
      }
    }
  }catch(e){}
}

let session = null;
let profile = null;
let activeTab = 'today';
let authMode = 'signin';
let flagsCache = null;

const todayStr = () => new Date().toISOString().slice(0,10);
const $ = sel => document.querySelector(sel);
const esc = s => (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const leafSvg = (color='var(--sage-500)', size=18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"><path d="M4 20C4 10 10 4 20 4C20 14 14 20 4 20Z" stroke="${color}" stroke-width="1.6"/><path d="M4 20C8 16 12 12 20 4" stroke="${color}" stroke-width="1.2"/></svg>`;

// ---------- Supabase REST helpers ----------
async function supa(path, opts={}){
  const headers = {'apikey': SUPABASE_KEY, 'Content-Type':'application/json', ...(opts.headers||{})};
  if(session?.access_token) headers['Authorization'] = 'Bearer ' + session.access_token;
  const res = await fetch(SUPABASE_URL + path, {...opts, headers});
  if(!res.ok){ const t = await res.text(); throw new Error(t); }
  if(res.status === 204) return null;
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function signUp(email, password){
  const res = await fetch(SUPABASE_URL+'/auth/v1/signup', {method:'POST', headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'}, body: JSON.stringify({email,password})});
  const data = await res.json();
  if(!res.ok) throw new Error(data.msg || data.error_description || 'Sign up failed');
  return data;
}
async function signIn(email, password){
  const res = await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password', {method:'POST', headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'}, body: JSON.stringify({email,password})});
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || 'Login failed');
  return data;
}
async function refreshSession(refresh_token){
  try{
    const res = await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token', {method:'POST', headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'}, body: JSON.stringify({refresh_token})});
    if(!res.ok) return null;
    return res.json();
  }catch(e){ return null; }
}
// ---------- Storage helper (works inside Claude artifacts AND on standalone GitHub Pages) ----------
async function storageSet(key, value){
  try{ if(window.storage){ await window.storage.set(key, value, false); return; } }catch(e){}
  try{ localStorage.setItem(key, value); }catch(e){}
}
async function storageGet(key){
  try{ if(window.storage){ const r = await window.storage.get(key); return r ? r.value : null; } }catch(e){}
  try{ return localStorage.getItem(key); }catch(e){}
  return null;
}
async function storageDelete(key){
  try{ if(window.storage){ await window.storage.delete(key, false); return; } }catch(e){}
  try{ localStorage.removeItem(key); }catch(e){}
}

async function saveSession(s){
  session = s;
  try{ await storageSet('session', JSON.stringify({refresh_token: s.refresh_token})); }catch(e){}
}
async function loadSession(){
  try{
    const raw = await storageGet('session');
    if(raw){
      const {refresh_token} = JSON.parse(raw);
      const fresh = await refreshSession(refresh_token);
      if(fresh && fresh.access_token){ session = fresh; return true; }
    }
  }catch(e){}
  return false;
}
async function signOut(){
  try{ await storageDelete('session'); }catch(e){}
  session = null; profile = null;
  render();
}

async function ensureProfile(){
  const uid = session.user.id;
  let rows = await supa(`/rest/v1/profiles?id=eq.${uid}&select=*`);
  if(!rows || rows.length === 0){
    rows = await supa('/rest/v1/profiles', {method:'POST', headers:{Prefer:'return=representation'}, body: JSON.stringify({id:uid, starting_weight:138, goal_weight:125, workout_goal_per_week:5})});
  }
  profile = rows[0];
}

// ---------- App shell ----------
async function init(){
  renderLoading();
  const ok = await loadSession();
  if(ok){ await ensureProfile(); }
  render();
}

function renderLoading(){
  $('#root').innerHTML = `<div style="text-align:center;padding:100px 20px;color:var(--ink-soft);">${leafSvg('var(--sage-400)',30)}<p>Loading…</p></div>`;
}

function render(){
  if(!session){ renderAuth(); return; }
  const root = $('#root');
  root.innerHTML = `
    <div class="app-header">
      <div class="brand">${leafSvg('var(--sage-600)',26)}<h1>Paola's Lifestyle</h1></div>
      <button class="signout" id="signout-btn">Sign out</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <section class="panel" id="panel"></section>
  `;
  $('#signout-btn').onclick = signOut;
  renderTabs();
  renderPanel();
}

const TABS = [
  {id:'today', label:'Today'},
  {id:'food', label:'Food & Macros'},
  {id:'inflammatory', label:'Inflammatory'},
  {id:'cycle', label:'Cycle'},
  {id:'weather', label:'Weather & Air'},
  {id:'progress', label:'Progress'},
  {id:'habits', label:'Habits'},
  {id:'journal', label:'Journal'},
  {id:'scripture', label:'Scripture'},
];

function renderTabs(){
  const wrap = $('#tabs');
  wrap.innerHTML = TABS.map(t => `<button class="tab-btn ${activeTab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  wrap.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => { activeTab = btn.dataset.tab; renderTabs(); renderPanel(); });
}

async function renderPanel(){
  const panel = $('#panel');
  panel.innerHTML = `<div class="empty-state">${leafSvg('var(--sage-300)',22)}<p>Loading…</p></div>`;
  try{
    if(activeTab==='today') await renderToday(panel);
    else if(activeTab==='food') await renderFood(panel);
    else if(activeTab==='inflammatory') await renderInflammatory(panel);
    else if(activeTab==='cycle') await renderCycle(panel);
    else if(activeTab==='weather') await renderWeather(panel);
    else if(activeTab==='progress') await renderProgress(panel);
    else if(activeTab==='habits') await renderHabits(panel);
    else if(activeTab==='journal') await renderJournal(panel);
    else if(activeTab==='scripture') await renderScripture(panel);
  }catch(e){
    panel.innerHTML = `<div class="card"><p class="auth-error">Something went wrong: ${esc(e.message)}</p></div>`;
  }
}

// ---------- AUTH SCREEN ----------
function renderAuth(){
  const root = $('#root');
  root.innerHTML = `
  <div class="auth-wrap">
    <div class="brand" style="justify-content:center;margin-bottom:14px;">${leafSvg('var(--sage-600)',30)}</div>
    <h1>Paola's Lifestyle</h1>
    <p class="auth-sub">A quiet place to track your body, your habits, and your goals.</p>
    <div class="card">
      <div class="field"><label>Email</label><input type="email" id="auth-email" autocomplete="email"></div>
      <div class="field"><label>Password</label><input type="password" id="auth-pass" autocomplete="current-password"></div>
      <button class="btn btn-primary" id="auth-submit">${authMode==='signin'?'Sign in':'Create account'}</button>
      <p class="auth-error" id="auth-err" style="display:none;"></p>
    </div>
    <p class="switch-link" id="switch-link">
      ${authMode==='signin' ? `Don't have an account? <a id="switch">Create one</a>` : `Already have an account? <a id="switch">Sign in</a>`}
    </p>
  </div>`;
  $('#switch').onclick = () => { authMode = authMode==='signin' ? 'signup' : 'signin'; renderAuth(); };
  $('#auth-submit').onclick = async () => {
    const email = $('#auth-email').value.trim();
    const pass = $('#auth-pass').value;
    const errEl = $('#auth-err');
    errEl.style.display='none';
    try{
      if(authMode==='signup'){
        const data = await signUp(email, pass);
        if(data.access_token){ await saveSession(data); await ensureProfile(); render(); }
        else { errEl.textContent = 'Account created — check your email to confirm, then sign in.'; errEl.style.display='block'; authMode='signin'; }
      } else {
        const data = await signIn(email, pass);
        await saveSession(data);
        await ensureProfile();
        render();
      }
    }catch(e){
      errEl.textContent = e.message;
      errEl.style.display='block';
    }
  };
}

// ---------- TODAY ----------
let selectedDate = todayStr();
function addDays(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}
function formatDateLabel(dateStr){
  if(dateStr === todayStr()) return {big:'Today', small: new Date(dateStr+'T00:00:00').toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'})};
  if(dateStr === addDays(todayStr(),-1)) return {big:'Yesterday', small: new Date(dateStr+'T00:00:00').toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'})};
  return {big: new Date(dateStr+'T00:00:00').toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'}), small: dateStr};
}
async function renderToday(panel){
  const uid = session.user.id;
  const [checkins, habits, logs] = await Promise.all([
    supa(`/rest/v1/daily_checkins?user_id=eq.${uid}&date=eq.${selectedDate}&select=*`),
    supa(`/rest/v1/habits?user_id=eq.${uid}&active=eq.true&order=created_at.asc&select=*`),
    supa(`/rest/v1/habit_logs?user_id=eq.${uid}&date=eq.${selectedDate}&select=*`),
  ]);
  const checkin = checkins[0] || {};
  const doneMap = {};
  logs.forEach(l => doneMap[l.habit_id] = l.completed);
  const label = formatDateLabel(selectedDate);
  const isFuture = selectedDate >= todayStr();

  panel.innerHTML = `
    <div class="card">
      <div class="date-nav">
        <button class="date-nav-btn" id="prev-day">‹</button>
        <div class="date-nav-label">
          <div class="big">${label.big}</div>
          <div class="small">${label.small}</div>
          ${selectedDate !== todayStr() ? `<button class="jump-today" id="jump-today">Jump to today</button>` : ''}
        </div>
        <button class="date-nav-btn" id="next-day" ${isFuture?'disabled':''}>›</button>
      </div>
    </div>
    <div class="row">
      <div class="card">
        <h2 class="section-title">Check-in</h2>
        <div class="field"><label>Weight (lbs)</label><input type="number" step="0.1" id="ci-weight" value="${checkin.weight ?? ''}" placeholder="${profile.starting_weight}"></div>
        <div class="field"><label>Dream / journal entry</label><textarea id="ci-notes" rows="3" placeholder="Anything on your heart or mind today — a dream, a reflection, a goal you're working toward.">${esc(checkin.notes||'')}</textarea></div>
        <button class="btn btn-primary" id="save-checkin">Save check-in</button>
      </div>
      <div class="card">
        <h2 class="section-title">Habits</h2>
        <div id="habit-list">${habits.length ? habits.map(h => habitRow(h, doneMap[h.id])).join('') : `<p class="empty-state">No habits yet — add some in the Habits tab.</p>`}</div>
      </div>
    </div>
  `;
  $('#prev-day').onclick = () => { selectedDate = addDays(selectedDate,-1); renderToday(panel); };
  $('#next-day').onclick = () => { if(!isFuture) { selectedDate = addDays(selectedDate,1); renderToday(panel); } };
  const jumpBtn = $('#jump-today');
  if(jumpBtn) jumpBtn.onclick = () => { selectedDate = todayStr(); renderToday(panel); };
  $('#save-checkin').onclick = async () => {
    const weight = $('#ci-weight').value ? parseFloat($('#ci-weight').value) : null;
    const notes = $('#ci-notes').value;
    await supa(`/rest/v1/daily_checkins?on_conflict=user_id,date`, {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=representation'}, body: JSON.stringify({user_id:uid, date:selectedDate, weight, notes})});
    renderToday(panel);
  };
  panel.querySelectorAll('.checkbox').forEach(cb => {
    cb.onclick = async () => {
      const habitId = cb.dataset.habit;
      const nowDone = cb.classList.contains('done');
      await supa(`/rest/v1/habit_logs?on_conflict=habit_id,date`, {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=representation'}, body: JSON.stringify({user_id:uid, habit_id:habitId, date:selectedDate, completed: !nowDone})});
      renderToday(panel);
    };
  });
}
function habitRow(h, done){
  return `<div class="habit-item">
    <div class="habit-check">
      <div class="checkbox ${done?'done':''}" data-habit="${h.id}">${done?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</div>
      <div><div class="habit-name">${esc(h.name)}</div><div class="habit-freq">${h.target_frequency}x / week</div></div>
    </div>
  </div>`;
}

// ---------- FOOD ----------
let pendingFood = null;
let foodSelectedDate = todayStr();
async function renderFood(panel){
  const uid = session.user.id;
  const [logs, checkins, presets] = await Promise.all([
    supa(`/rest/v1/food_logs?user_id=eq.${uid}&date=eq.${foodSelectedDate}&order=created_at.asc&select=*`),
    supa(`/rest/v1/daily_checkins?user_id=eq.${uid}&date=eq.${foodSelectedDate}&select=day_completed,macro_preset_id`),
    supa(`/rest/v1/macro_presets?user_id=eq.${uid}&order=created_at.asc&select=*`)

  const dayCompleted = checkins[0]?.day_completed || false;
  const activePresetId = checkins[0]?.macro_preset_id || '';
  const activePreset = presets.find(p => p.id === activePresetId);
  const effectiveTargets = activePreset
    ? { target_calories: activePreset.calories, target_protein: activePreset.protein, target_carbs: activePreset.carbs, target_fat: activePreset.fat, macro_tolerance_pct: profile.macro_tolerance_pct }
    : profile;
  const label = formatDateLabel(foodSelectedDate);
  const isFuture = foodSelectedDate >= todayStr();

  panel.innerHTML = `
    <div class="card">
      <div class="date-nav">
        <button class="date-nav-btn" id="food-prev">‹</button>
        <div class="date-nav-label">
          <div class="big">${label.big}</div>
          <div class="small">${label.small}</div>
          ${foodSelectedDate !== todayStr() ? `<button class="jump-today" id="food-jump">Jump to today</button>` : ''}
        </div>
        <button class="date-nav-btn" id="food-next" ${isFuture?'disabled':''}>›</button>
      </div>
      ${presets.length ? `
        <div class="field" style="margin-top:14px;margin-bottom:0;">
          <label>Macro plan for this day</label>
          <select id="preset-select">
            <option value="">Default goals</option>
            ${presets.map(p => `<option value="${p.id}" ${p.id===activePresetId?'selected':''}>${esc(p.name)} (${Math.round(p.calories)} cal)</option>`).join('')}
          </select>
        </div>
      ` : ''}
    </div>
    ${dayCompleted ? `
    <div class="card" style="text-align:center;">
      ${leafSvg('var(--sage-600)',26)}
      <h2 class="section-title" style="text-align:center;">Day complete</h2>
      <p class="muted">${Math.round(totals.cal)} cal · ${Math.round(totals.p)}g protein · ${Math.round(totals.c)}g carbs · ${Math.round(totals.f)}g fat logged for ${label.big==='Today'?'today':label.small}.</p>
      <button class="btn btn-ghost" id="reopen-day" style="width:auto;padding:8px 20px;margin-top:8px;">Edit this day</button>
    </div>
    ` : `
    <div class="card">
      <h2 class="section-title">Add food</h2>
      <div class="btn-row" style="margin-bottom:14px;">
        <button class="add-toggle" id="mode-search">Search database</button>
        <button class="add-toggle" id="mode-scan">Scan barcode</button>
        <button class="add-toggle" id="mode-manual">Manual entry</button>
      </div>
      <div id="add-food-area"></div>
    </div>
    `}
    <div class="card">
      <h2 class="section-title">${dayCompleted ? "Log" : "Today's log"}</h2>
      <div class="totals-bar">
        <div class="t"><b>${Math.round(totals.cal)}</b>cal</div>
        <div class="t"><b>${Math.round(totals.p)}g</b>protein</div>
        <div class="t"><b>${Math.round(totals.c)}g</b>carbs</div>
        <div class="t"><b>${Math.round(totals.f)}g</b>fat</div>
      </div>
      <div style="margin-top:14px;">
        ${logs.length? logs.map(foodRow).join('') : `<p class="empty-state">Nothing logged for this day.</p>`}
      </div>
      ${!dayCompleted && logs.length > 0 ? `<button class="btn btn-primary" id="complete-day" style="width:auto;padding:10px 22px;margin-top:14px;">Complete today's log</button>` : ''}
    </div>
    <div class="card">
      <h2 class="section-title">Macro breakdown</h2>
      ${macroDonut(totals, effectiveTargets)}
    </div>
    ${!dayCompleted ? `<div class="card"><h2 class="section-title">Foods to help close the gap</h2><div id="food-suggestions">${foodSuggestionsHtml(totals, effectiveTargets)}</div></div>` : ''}
  `;
  $('#food-prev').onclick = () => { foodSelectedDate = addDays(foodSelectedDate,-1); renderFood(panel); };
  $('#food-next').onclick = () => { if(!isFuture){ foodSelectedDate = addDays(foodSelectedDate,1); renderFood(panel); } };
  const jumpBtn = $('#food-jump');
  if(jumpBtn) jumpBtn.onclick = () => { foodSelectedDate = todayStr(); renderFood(panel); };
  const presetSelect = $('#preset-select');
  if(presetSelect) presetSelect.onchange = async () => {
    await supa(`/rest/v1/daily_checkins?on_conflict=user_id,date`, {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=representation'}, body: JSON.stringify({user_id:uid, date:foodSelectedDate, macro_preset_id: presetSelect.value || null})});
    renderFood(panel);
  };
  const completeBtn = $('#complete-day');
  if(completeBtn) completeBtn.onclick = async () => {
    await supa(`/rest/v1/daily_checkins?on_conflict=user_id,date`, {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=representation'}, body: JSON.stringify({user_id:uid, date:foodSelectedDate, day_completed:true})});
    renderFood(panel);
  };
  const reopenBtn = $('#reopen-day');
  if(reopenBtn) reopenBtn.onclick = async () => {
    await supa(`/rest/v1/daily_checkins?on_conflict=user_id,date`, {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=representation'}, body: JSON.stringify({user_id:uid, date:foodSelectedDate, day_completed:false})});
    renderFood(panel);
  };
  panel.querySelectorAll('.del-food').forEach(b => b.onclick = async () => {
    await supa(`/rest/v1/food_logs?id=eq.${b.dataset.id}`, {method:'DELETE'});
    renderFood(panel);
  });
  if(dayCompleted) return;
  function setActiveToggle(mode){
    ['search','scan','manual'].forEach(m => $('#mode-'+m).classList.toggle('active', m===mode));
  }
  $('#mode-search').onclick = () => { setActiveToggle('search'); renderManualArea('search'); };
  $('#mode-scan').onclick = () => { setActiveToggle('scan'); renderManualArea('scan'); };
  $('#mode-manual').onclick = () => { setActiveToggle('manual'); renderManualArea('manual'); };
  setActiveToggle('search');
  renderManualArea('search');

  function renderManualArea(mode){
    const area = $('#add-food-area');
    if(mode==='manual'){
      area.innerHTML = manualFormHtml();
      wireManualForm();
    } else if(mode==='search'){
      area.innerHTML = `
        <div class="field"><label>Search USDA food database</label><input type="text" id="usda-q" placeholder="e.g. grilled chicken breast"></div>
        <button class="btn btn-ghost" id="usda-search-btn">Search</button>
        <div class="search-results" id="usda-results"></div>
      `;
      $('#usda-search-btn').onclick = async () => {
        const q = $('#usda-q').value.trim();
        if(!q) return;
        $('#usda-results').innerHTML = '<p class="muted">Searching…</p>';
        try{
          const res = await fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${USDA_KEY}&query=${encodeURIComponent(q)}&pageSize=8`);
          const data = await res.json();
          const foods = data.foods || [];
          $('#usda-results').innerHTML = foods.length ? foods.map((f,i)=>{
            const bits = [];
            if(f.dataType) bits.push(f.dataType);
            if(f.brandOwner) bits.push(f.brandOwner);
            if(f.foodCategory) bits.push(f.foodCategory);
            if(f.servingSize && f.servingSizeUnit) bits.push(`${f.servingSize}${f.servingSizeUnit} serving`);
            return `<div class="search-result" data-idx="${i}">
              <div style="font-weight:600;">${esc(f.description)}</div>
              ${bits.length ? `<div class="muted" style="margin-top:2px;">${esc(bits.join(' · '))}</div>` : ''}
            </div>`;
          }).join('') : '<p class="muted">No results.</p>';
          $('#usda-results').querySelectorAll('.search-result').forEach(el => el.onclick = async () => {
            const f = foods[el.dataset.idx];
            area.innerHTML = `<p class="muted">Loading serving details for ${esc(f.description)}…</p>`;
            let base100 = {calories:0, protein:0, carbs:0, fat:0};
            let portions = [];
            try{
              const dRes = await fetch(`https://api.nal.usda.gov/fdc/v1/food/${f.fdcId}?api_key=${USDA_KEY}`);
              const detail = await dRes.json();
              const getAmt = (name) => {
                const list = detail.foodNutrients || [];
                const match = list.find(n => (n.nutrientName || n.nutrient?.name || '').toLowerCase().includes(name.toLowerCase()));
                return match ? (match.value ?? match.amount ?? 0) : 0;
              };
              base100 = {
                calories: getAmt('Energy'),
                protein: getAmt('Protein'),
                carbs: getAmt('Carbohydrate'),
                fat: getAmt('Total lipid')
              };
              if(detail.servingSize && detail.servingSizeUnit){
                let label = `Label serving (${detail.servingSize}${detail.servingSizeUnit})`;
                if(detail.householdServingFullText) label += ` — ${detail.householdServingFullText}`;
                portions.push({label, grams: detail.servingSizeUnit==='g' ? detail.servingSize : 100});
              }
              (detail.foodPortions || []).forEach(p => {
                if(!p.gramWeight) return;
                const desc = [p.amount, p.modifier || p.portionDescription].filter(Boolean).join(' ') || `${p.gramWeight}g portion`;
                portions.push({label: `${desc} (${Math.round(p.gramWeight)}g)`, grams: p.gramWeight});
              });
            }catch(e){ /* fall through to 100g default below */ }
            portions.push({label:'100 g (standard reference)', grams:100});
            pendingFood = { food_name: f.description, source:'usda', base100, portions };
            area.innerHTML = manualFormHtml(pendingFood);
            wireManualForm();
          });
        }catch(e){ $('#usda-results').innerHTML = '<p class="auth-error">Search failed.</p>'; }
      };
    } else if(mode==='scan'){
      area.innerHTML = `
        <div id="reader"></div>
        <p class="muted" style="text-align:center;">Fill the box with the barcode, hold steady, good lighting helps a lot.</p>
        <div class="field" style="margin-top:16px;">
          <label>Camera not catching it? Type the barcode number instead</label>
          <div class="qty-row" style="max-width:none;">
            <input type="text" id="manual-barcode" inputmode="numeric" placeholder="e.g. 049000028911" style="flex:1;">
            <button class="btn btn-ghost" id="manual-barcode-lookup" style="padding:9px 16px;">Look up</button>
          </div>
        </div>
      `;
      $('#manual-barcode-lookup').onclick = () => {
        const code = $('#manual-barcode').value.trim();
        if(code) lookupBarcode(code, area);
      };
      if(!window.isSecureContext){
        area.innerHTML += `<p class="auth-error">Camera access needs a secure (https) connection.</p>`;
        return;
      }
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        area.innerHTML += `<p class="auth-error">This browser doesn't support camera access — the manual entry above will still work.</p>`;
        return;
      }
      const qr = new Html5Qrcode('reader', { formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.QR_CODE
      ], verbose: false });
      let scanned = false;
      qr.start(
        { facingMode: 'environment' },
        {
          fps: 12,
          qrbox: { width: 300, height: 160 },
          aspectRatio: 1.6,
          videoConstraints: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: 'continuous' }] }
        },
        async (decoded) => {
          if(scanned) return;
          scanned = true;
          qr.stop().catch(()=>{});
          await lookupBarcode(decoded, area);
        },
        ()=>{ /* fires continuously while no code is found yet — expected, not an error */ }
      ).catch((err)=>{
        const msg = (err && err.toString) ? err.toString() : 'Unknown error';
        area.innerHTML += `<p class="auth-error">Camera couldn't start: ${esc(msg)}</p>
          <p class="muted">Most likely fix: tap the padlock/site-info icon next to the address bar → Site settings → Camera → Allow, then reload. The manual entry above will still work either way.</p>`;
      });
    }
  }

  async function lookupBarcode(decoded, area){
    area.innerHTML = `<p class="muted">Found code ${esc(decoded)} — looking up product…</p>`;
    try{
      const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${decoded}.json`);
      const data = await res.json();
      if(data.status !== 1){ area.innerHTML = `<p class="auth-error">Code ${esc(decoded)} scanned, but no product found in Open Food Facts. Try manual entry instead.</p>`; return; }
      const p = data.product;
      const n = p.nutriments || {};
      pendingFood = {
        food_name: p.product_name || 'Scanned item',
        calories: n['energy-kcal_100g'] || n['energy-kcal_serving'] || 0,
        protein: n['proteins_100g'] || n['proteins_serving'] || 0,
        carbs: n['carbohydrates_100g'] || n['carbohydrates_serving'] || 0,
        fat: n['fat_100g'] || n['fat_serving'] || 0,
        source: 'barcode',
        barcode: decoded,
        ingredients_raw: p.ingredients_text || '',
        servingLabel: 'per 100g (package label)'
      };
      area.innerHTML = manualFormHtml(pendingFood);
      wireManualForm();
    }catch(e){ area.innerHTML = `<p class="auth-error">Lookup failed — check your connection and try again.</p>`; }
  }

  function manualFormHtml(prefill={}){
    const hasPortions = prefill.portions && prefill.portions.length;
    let cal=prefill.calories||0, p=prefill.protein||0, c=prefill.carbs||0, f=prefill.fat||0;
    if(hasPortions && prefill.base100){
      const grams = prefill.portions[0].grams;
      const mult = grams/100;
      cal = Math.round(prefill.base100.calories*mult);
      p = Math.round(prefill.base100.protein*mult);
      c = Math.round(prefill.base100.carbs*mult);
      f = Math.round(prefill.base100.fat*mult);
    }
    return `
      <div class="row">

function foodSuggestionsHtml(totals, targets){
  if(targets?.target_calories == null) return `<p class="empty-state">Set a calorie/macro target in the Progress tab to get personalized suggestions here.</p>`;
  const remCal = targets.target_calories - totals.cal;
  const remP = (targets.target_protein ?? null) != null ? targets.target_protein - totals.p : null;
  const remC = (targets.target_carbs ?? null) != null ? targets.target_carbs - totals.c : null;
  const remF = (targets.target_fat ?? null) != null ? targets.target_fat - totals.f : null;

  if(remCal <= 20) return `<p class="empty-state">You're at or past your calorie goal for the day — nice work. No suggestions needed.</p>`;

  // find which macro has the biggest remaining gap, in grams-equivalent terms
  const gaps = [];
  if(remP != null && remP > 3) gaps.push(['protein', remP]);
  if(remC != null && remC > 3) gaps.push(['carbs', remC]);
  if(remF != null && remF > 3) gaps.push(['fat', remF]);
  gaps.sort((a,b) => b[1]-a[1]);
  const priority = gaps.length ? gaps[0][0] : null;

  const candidates = SUGGESTION_FOODS.filter(f => f.calories <= remCal * 1.3);
  let sorted;
  if(priority === 'protein') sorted = candidates.slice().sort((a,b) => b.protein - a.protein);
  else if(priority === 'carbs') sorted = candidates.slice().sort((a,b) => b.carbs - a.carbs);
  else if(priority === 'fat') sorted = candidates.slice().sort((a,b) => b.fat - a.fat);
  else sorted = candidates.slice().sort((a,b) => Math.abs(a.calories-remCal) - Math.abs(b.calories-remCal));

  const top = sorted.slice(0,4);
  if(!top.length) return `<p class="empty-state">Not much room left in your calorie budget for a full suggestion — a small snack like a few almonds or some berries could round out the day.</p>`;

  return `
    <p class="muted">You have about <b>${Math.round(remCal)} cal</b> left${priority ? `, and ${priority} is your biggest remaining gap` : ''}. A few options that would help:</p>
    <div style="margin-top:10px;">
      ${top.map(f => `
        <div class="food-row">
          <div>
            <div class="food-name">${esc(f.name)} <span class="muted">· ${esc(f.serving)}</span></div>
            <div class="food-macros"><span class="macro-pill">${f.calories} cal</span><span class="macro-pill">${f.protein}g P</span><span class="macro-pill">${f.carbs}g C</span><span class="macro-pill">${f.fat}g F</span></div>
          </div>
        </div>
      `).join('')}
    </div>
    <p class="muted" style="margin-top:10px;">Estimated values — search or scan the real item to log it precisely.</p>
  `;
}

function macroDonut(totals, profile){
  const pCal = totals.p*4, cCal = totals.c*4, fCal = totals.f*9;
  const macroSum = pCal + cCal + fCal;
  if(macroSum <= 0 && totals.cal <= 0) return `<p class="empty-state">Log some food to see your macro split.</p>`;
  if(macroSum <= 0) return `<p class="empty-state">You've logged ${Math.round(totals.cal)} calories, but no protein/carb/fat yet — fill in macros on your entries to see the split.</p>`;
  const colors = {protein:'var(--sage-600)', carbs:'var(--gold)', fat:'var(--rust)'};
  const slices = [['protein',pCal],['carbs',cCal],['fat',fCal]];
  const r = 60, cx = 70, cy = 70, circumference = 2*Math.PI*r;
  let offset = 0;
  const paths = slices.map(([name,val]) => {
    const frac = val/macroSum;
    const dash = frac*circumference;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[name]}" stroke-width="18" stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
    return seg;
  }).join('');
  const mismatch = Math.abs(totals.cal - macroSum) > 25;

  const tol = (profile?.macro_tolerance_pct ?? 10) / 100;
  function statusFor(actual, target){
    if(target == null || target === '') return null;
    const low = target * (1 - tol), high = target * (1 + tol);
    if(actual < low) return {ok:false, dir:'under', color:'#C9A63B'};
    if(actual > high) return {ok:false, dir:'over', color:'var(--rust)'};
    return {ok:true, dir:'on target', color:'var(--sage-600)'};
  }
  const targets = [
    ['Calories', totals.cal, profile?.target_calories],
    ['Protein', totals.p, profile?.target_protein],
    ['Carbs', totals.c, profile?.target_carbs],
    ['Fat', totals.f, profile?.target_fat],
  ];
  const hasAnyTarget = targets.some(t => t[2] != null && t[2] !== '');
  const targetRows = hasAnyTarget ? targets.filter(t => t[2] != null && t[2] !== '').map(([label,actual,target]) => {
    const s = statusFor(actual, target);
    return `<div class="correlation-bar-row">
      <div class="correlation-label"><span>${esc(label)} — ${Math.round(actual)} / ${Math.round(target)}${label==='Calories'?'':'g'}</span><b style="color:${s.color};">${s.dir}</b></div>
    </div>`;
  }).join('') : '';

  return `
    <div class="donut-wrap">
      <svg width="140" height="140" viewBox="0 0 140 140">${paths}<text x="70" y="74" text-anchor="middle" font-family="Fraunces,serif" font-size="16" fill="var(--ink)">${Math.round(totals.cal)} cal</text></svg>
      <div class="donut-legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--sage-600);"></span>Protein — ${Math.round(totals.p)}g (${Math.round(pCal/macroSum*100)}%)</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--gold);"></span>Carbs — ${Math.round(totals.c)}g (${Math.round(cCal/macroSum*100)}%)</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--rust);"></span>Fat — ${Math.round(totals.f)}g (${Math.round(fCal/macroSum*100)}%)</div>
      </div>
    </div>
    ${hasAnyTarget ? `<div style="margin-top:16px;">${targetRows}</div>` : `<p class="muted" style="margin-top:14px;">Set macro targets in the Progress tab to see how today compares.</p>`}
    ${mismatch ? `<p class="serving-note" style="margin-top:14px;">Heads up: your macros add up to ${Math.round(macroSum)} cal, but your logged total is ${Math.round(totals.cal)} cal — likely one or more entries has calories filled in without protein/carb/fat. Edit those entries to fill in macros for a fully accurate split.</p>` : ''}`;
}

async function renderInflammatory(panel){
  const uid = session.user.id;
  if(!flagsCache) flagsCache = await supa('/rest/v1/inflammatory_flags?select=*');
  const weekAgo = new Date(Date.now() - 6*86400000).toISOString().slice(0,10);
  const logs = await supa(`/rest/v1/food_logs?user_id=eq.${uid}&date=gte.${weekAgo}&select=*`);

  const catCounts = {};
  const flaggedItems = [];
  logs.forEach(l => {
    const text = `${l.food_name||''} ${l.ingredients_raw||''}`.toLowerCase();
    flagsCache.forEach(f => {
      if(text.includes(f.keyword.toLowerCase())){
        catCounts[f.category] = (catCounts[f.category]||0) + 1;
        flaggedItems.push({food: l.food_name, category: f.category, date: l.date});
      }
    });
  });
  const max = Math.max(1, ...Object.values(catCounts));

  panel.innerHTML = `
    <div class="card">
      <h2 class="section-title">This week's inflammatory load</h2>
      <p class="muted">Checks both the food name you logged and any ingredient text (from barcode scans) against a list of seed oils, added sugars, refined grains, processed meats, and additives. So "mayo" or "chocolate cake" gets flagged from the name alone — barcode scans go further and check the full ingredient list too.</p>
      ${Object.keys(catCounts).length ? Object.entries(catCounts).map(([cat,count]) => `
        <div class="flag-cat">
          <div style="width:130px;font-size:13px;text-transform:capitalize;">${esc(cat)}</div>
          <div class="flag-bar-track"><div class="flag-bar-fill" style="width:${(count/max)*100}%;"></div></div>
          <div class="flag-count">${count}</div>
        </div>
      `).join('') : `<p class="empty-state">No flags this week — nicely clean 🌿</p>`}
    </div>
    <div class="card">
      <h2 class="section-title">Flagged items</h2>
      ${flaggedItems.length ? flaggedItems.map(i => `<div class="food-row"><div class="food-name">${esc(i.food)}</div><div class="muted">${esc(i.category)} · ${i.date}</div></div>`).join('') : `<p class="empty-state">Nothing flagged this week.</p>`}
    </div>
  `;
}

async function renderProgress(panel){

  const presets = await supa(`/rest/v1/macro_presets?user_id=eq.${uid}&order=created_at.asc&select=*`);
  const latest = checkins.length ? checkins[checkins.length-1].weight : profile.starting_weight;
  const start = profile.starting_weight, goal = profile.goal_weight;
  const totalDelta = Math.abs(start - goal) || 1;
  const progressed = Math.max(0, Math.min(1, Math.abs(start - latest) / totalDelta));

  let chartSvg = `<p class="empty-state">Log a few check-ins to see your trend line.</p>`;
  if(checkins.length >= 2){
    const w = 640, h = 160, pad = 20;
    const weights = checkins.map(c=>+c.weight);
    const minW = Math.min(...weights, goal) - 1, maxW = Math.max(...weights, start) + 1;
    const pts = checkins.map((c,i) => {
      const x = pad + (i/(checkins.length-1)) * (w-2*pad);
      const y = h - pad - ((c.weight - minW)/(maxW-minW)) * (h-2*pad);
      return `${x},${y}`;
    }).join(' ');
    const goalY = h - pad - ((goal - minW)/(maxW-minW)) * (h-2*pad);
    chartSvg = `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <line x1="${pad}" y1="${goalY}" x2="${w-pad}" y2="${goalY}" stroke="var(--gold)" stroke-dasharray="4 4" stroke-width="1.5"/>
      <polyline points="${pts}" fill="none" stroke="var(--sage-600)" stroke-width="2.5"/>
      ${checkins.map((c,i)=>{const x=pad+(i/(checkins.length-1))*(w-2*pad);const y=h-pad-((c.weight-minW)/(maxW-minW))*(h-2*pad);return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--sage-700)"/>`;}).join('')}
    </svg>`;

        $('#pct-grams-preview').innerHTML = `${total}% of calories allocated${Math.abs(total-100)>1?' — doesn\'t need to be exactly 100%, that\'s fine for flexible days':''}. At ${Math.round(cal)} cal, that's roughly <b>${pg}g protein · ${cg}g carbs · ${fg}g fat</b>.`;
      };
      ['#g-p-pct','#g-c-pct','#g-f-pct'].forEach(sel => $(sel).oninput = updatePreview);
      updatePreview();
    }
  }
  $('#macro-mode-toggle').querySelectorAll('button').forEach(b => b.onclick = () => { macroMode = b.dataset.mode; renderMacroInputs(); });
  $('#g-cal').oninput = () => { if(macroMode==='percent') renderMacroInputs(); };
  renderMacroInputs();

  // ---- calorie suggestion based on target date + TDEE estimate ----
  function renderCalorieSuggestion(){
    const targetDate = $('#g-date').value;
    const heightIn = parseFloat($('#g-height').value);
    const age = parseInt($('#g-age').value);
    const activity = $('#g-activity').value;
    const goalW = parseFloat($('#g-goal').value) || profile.goal_weight;
    const box = $('#calorie-suggestion-box');
    if(!targetDate || !goalW){ box.innerHTML = ''; return; }
    const daysRemaining = Math.ceil((new Date(targetDate) - new Date(todayStr())) / 86400000);
    if(daysRemaining <= 0){ box.innerHTML = `<p class="auth-error">Target date should be in the future.</p>`; return; }
    const currentWeight = latest;
    const lbsToLose = currentWeight - goalW;
    const weeksRemaining = daysRemaining / 7;
    const weeklyRate = lbsToLose / weeksRemaining;
    let html = `<p class="muted">At this pace: about <b>${weeklyRate.toFixed(1)} lbs/week</b> over ${Math.round(weeksRemaining)} weeks.</p>`;
    let warning = '';
    if(Math.abs(weeklyRate) > 2) warning += "That's faster than the commonly recommended max of ~2 lbs/week — a later target date would be gentler. ";
    if(heightIn && age){
      const weightKg = currentWeight * 0.4536, heightCm = heightIn * 2.54;
      const bmr = 10*weightKg + 6.25*heightCm - 5*age - 161;
      const activityMap = {sedentary:1.2, light:1.375, moderate:1.55, active:1.725};
      const maintenance = bmr * (activityMap[activity]||1.2);
      const dailyDeficit = (lbsToLose*3500) / daysRemaining;
      let suggestedCal = Math.round(maintenance - dailyDeficit);
      if(suggestedCal < 1200){ warning += "This pace would put you under 1200 cal/day, generally considered too low without medical supervision — please check with your doctor before going this low. "; }
      html += `<p class="muted">Estimated maintenance: <b>${Math.round(maintenance)} cal/day</b>. Suggested target: <b>${suggestedCal} cal/day</b>.</p>`;
      if(warning) html += `<p class="serving-note">${esc(warning)}</p>`;
      html += `<button class="btn-ghost" id="use-suggested-cal" style="padding:6px 14px;font-size:12px;">Use ${suggestedCal} as my calorie target</button>`;
    } else {
      html += `<p class="muted">Add height and age above for a personalized calorie estimate.</p>`;
    }
    box.innerHTML = html;
    const useBtn = $('#use-suggested-cal');
    if(useBtn) useBtn.onclick = () => { $('#g-cal').value = useBtn.textContent.match(/\d+/)[0]; if(macroMode==='percent') renderMacroInputs(); };
  }
  ['#g-date','#g-height','#g-age','#g-activity','#g-goal'].forEach(sel => $(sel).addEventListener('input', renderCalorieSuggestion));
  renderCalorieSuggestion();

  $('#save-goals').onclick = async () => {
    const cal = $('#g-cal').value ? parseFloat($('#g-cal').value) : null;
    let body = {
      starting_weight: parseFloat($('#g-start').value) || null,
      goal_weight: parseFloat($('#g-goal').value) || null,
      workout_goal_per_week: parseInt($('#g-workout').value) || null,
      target_date: $('#g-date').value || null,
      height_inches: $('#g-height').value ? parseFloat($('#g-height').value) : null,
      age: $('#g-age').value ? parseInt($('#g-age').value) : null,
      activity_level: $('#g-activity').value,
      target_calories: cal,
      macro_tolerance_pct: $('#g-tol').value ? parseFloat($('#g-tol').value) : 10,
    };
    if(macroMode === 'grams'){
      body.target_protein = $('#g-p').value ? parseFloat($('#g-p').value) : null;
      body.target_carbs = $('#g-c').value ? parseFloat($('#g-c').value) : null;
      body.target_fat = $('#g-f').value ? parseFloat($('#g-f').value) : null;
      body.target_protein_pct = null; body.target_carbs_pct = null; body.target_fat_pct = null;
    } else {
      const pp = $('#g-p-pct').value ? parseFloat($('#g-p-pct').value) : null;
      const cp = $('#g-c-pct').value ? parseFloat($('#g-c-pct').value) : null;
      const fp = $('#g-f-pct').value ? parseFloat($('#g-f-pct').value) : null;
      body.target_protein_pct = pp; body.target_carbs_pct = cp; body.target_fat_pct = fp;
      body.target_protein = (pp!=null && cal) ? Math.round((pp/100*cal)/4) : null;
      body.target_carbs = (cp!=null && cal) ? Math.round((cp/100*cal)/4) : null;
      body.target_fat = (fp!=null && cal) ? Math.round((fp/100*cal)/9) : null;
    }
    await supa(`/rest/v1/profiles?id=eq.${uid}`, {method:'PATCH', body: JSON.stringify(body)});
    await ensureProfile();
    renderProgress(panel);
  };

  // ---- macro presets ----
  const updatePresetPctTotal = () => {
    const p = parseFloat($('#pr-p-pct').value)||0, c = parseFloat($('#pr-c-pct').value)||0, f = parseFloat($('#pr-f-pct').value)||0;
    $('#preset-pct-total').textContent = `${p+c+f}% allocated (doesn't need to total exactly 100%)`;
  };
  ['#pr-p-pct','#pr-c-pct','#pr-f-pct'].forEach(sel => $(sel).oninput = updatePresetPctTotal);
  updatePresetPctTotal();
  $('#add-preset').onclick = async () => {
    const name = $('#pr-name').value.trim();
    if(!name) return;
    const cal = parseFloat($('#pr-cal').value) || 0;
    const pp = parseFloat($('#pr-p-pct').value)||0, cp = parseFloat($('#pr-c-pct').value)||0, fp = parseFloat($('#pr-f-pct').value)||0;
    await supa('/rest/v1/macro_presets', {method:'POST', headers:{Prefer:'return=representation'}, body: JSON.stringify({
      user_id: uid, name, calories: cal,
      protein: Math.round((pp/100*cal)/4), carbs: Math.round((cp/100*cal)/4), fat: Math.round((fp/100*cal)/9)
    })});
    renderProgress(panel);
  };
  panel.querySelectorAll('.del-preset').forEach(b => b.onclick = async () => {
    await supa(`/rest/v1/macro_presets?id=eq.${b.dataset.id}`, {method:'DELETE'});
    renderProgress(panel);
  });
}

const WMO_CODES = {
  0:['Clear sky','☀️'],1:['Mostly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],
  45:['Foggy','🌫️'],48:['Foggy','🌫️'],
  51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Heavy drizzle','🌧️'],
  61:['Light rain','🌧️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],
  71:['Light snow','🌨️'],73:['Snow','🌨️'],75:['Heavy snow','❄️'],
  80:['Rain showers','🌦️'],81:['Rain showers','🌦️'],82:['Violent showers','⛈️'],
  95:['Thunderstorm','⛈️'],96:['Thunderstorm','⛈️'],99:['Thunderstorm','⛈️']
};
function aqiInfo(aqi){
  if(aqi==null) return {label:'Unknown', color:'#999', guidance:'', who:''};
  if(aqi<=50) return {label:'Good', color:'#6B9B5E', guidance:"Air quality is in good shape today — no real concerns. A fine day to be outside as much as you'd like.", who:'Everyone'};
  if(aqi<=100) return {label:'Moderate', color:'#C9A63B', guidance:"Fine for most people. If you're unusually sensitive to air pollution (asthma, allergies, or you've noticed symptoms on hazier days before), you might notice something faint — otherwise, no real change to your day.", who:'Most people unaffected'};
  if(aqi<=150) return {label:'Unhealthy for sensitive groups', color:'#D98B3C', guidance:"Most people are fine, but if you have asthma, a respiratory condition, are pregnant, or tend to react to air quality, it's worth shortening or lightening up outdoor exercise today.", who:'Sensitive groups should take it easier outdoors'};
  if(aqi<=200) return {label:'Unhealthy', color:'#C15B4A', guidance:"Everyone may start to notice effects — think throat irritation, tiredness, shortness of breath during activity. Worth moving harder workouts indoors today, especially if you're already feeling inflamed or run down.", who:'Everyone may notice effects'};
  if(aqi<=300) return {label:'Very unhealthy', color:'#8B5A9E', guidance:"This is a health alert level. Limit outdoor time and exertion for everyone, not just sensitive groups — this is a good day to keep workouts indoors.", who:'Everyone should limit outdoor exertion'};
  return {label:'Hazardous', color:'#6B3A3A', guidance:"Emergency-level air quality. Stay indoors as much as you can today and avoid outdoor exertion entirely.", who:'Everyone should stay indoors'};
}

const POLLUTANT_GLOSSARY = {
  'PM2.5': "Tiny particles (from smoke, vehicle exhaust, dust) small enough to get deep into your lungs and bloodstream. This is usually the pollutant that drives the AQI number day to day, and it's the one most linked to inflammation in the body.",
  'PM10': "Slightly larger particles — dust, pollen fragments, mold spores. These mostly irritate your nose, throat, and airways rather than going as deep as PM2.5.",
  'Ozone': "Ground-level ozone (different from the protective ozone layer way up in the atmosphere) forms from sunlight reacting with pollution. It tends to peak on hot, sunny afternoons and can irritate your lungs, especially during exercise.",
  'NO₂': "Nitrogen dioxide, mostly from vehicle exhaust and combustion. Higher near busy roads — can irritate airways, especially if you already deal with asthma or sensitivity."
};

async function loadWeatherFor(zip){
  const body = $('#weather-body');
  try{
    const geoRes = await fetch(`https://api.zippopotam.us/us/${encodeURIComponent(zip)}`);
    if(!geoRes.ok){ body.innerHTML = `<p class="auth-error">Couldn't find that zip code. Double check it and try again.</p>`; return; }
    const geo = await geoRes.json();
    const place = geo.places[0];
    const lat = place.latitude, lon = place.longitude;
    const placeName = `${place['place name']}, ${place['state abbreviation']}`;

    const [wRes, aRes] = await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`),
      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi,pm2_5,pm10,ozone,nitrogen_dioxide&timezone=auto`)
    ]);
    const w = await wRes.json();
    const a = await aRes.json();

    const [desc, icon] = WMO_CODES[w.current.weather_code] || ['—','🌡️'];
    const temp = w.current.temperature_2m, humidity = w.current.relative_humidity_2m;
    let weatherNote = '';
    if(temp >= 90) weatherNote = "It's hot out there — hydrate well if you're heading outside, especially for a workout.";
    else if(temp <= 45) weatherNote = "Chilly today — worth a layer if you're stepping out.";
    else weatherNote = "Comfortable range today, nothing extreme to plan around.";
    if(humidity >= 75) weatherNote += " Humidity is high too, so it may feel warmer than the number suggests.";
    const aqi = a.current?.us_aqi;
    const aq = aqiInfo(aqi);

    body.innerHTML = `
      <p class="muted" style="text-align:center;">${esc(placeName)}</p>
      <div class="weather-hero">
        <div style="font-size:36px;">${icon}</div>
        <div class="weather-temp">${Math.round(w.current.temperature_2m)}°</div>
        <div class="weather-desc">${esc(desc)}</div>
        <div class="weather-sub">
          <div class="ws"><b>${Math.round(w.daily.temperature_2m_max[0])}°</b>high</div>
          <div class="ws"><b>${Math.round(w.daily.temperature_2m_min[0])}°</b>low</div>
          <div class="ws"><b>${Math.round(w.current.relative_humidity_2m)}%</b>humidity</div>
          <div class="ws"><b>${Math.round(w.current.wind_speed_10m)}mph</b>wind</div>
        </div>
        <p class="muted" style="margin-top:14px;">${esc(weatherNote)}</p>
      </div>
    `;

    const aqCard = document.createElement('div');
    aqCard.className = 'card';
    aqCard.innerHTML = `
      <h2 class="section-title">Air quality</h2>
      <div style="text-align:center;">
        <div class="aqi-label">US AQI</div>
        <div class="aqi-badge" style="background:${aq.color};">${aqi ?? '—'}</div>
        <div class="muted">${aq.label}</div>
      </div>
      <div class="pollutant-grid">
        <div class="pollutant-item"><b>${a.current?.pm2_5?.toFixed(1) ?? '—'}</b><span>PM2.5</span></div>
        <div class="pollutant-item"><b>${a.current?.pm10?.toFixed(1) ?? '—'}</b><span>PM10</span></div>
        <div class="pollutant-item"><b>${a.current?.ozone?.toFixed(0) ?? '—'}</b><span>Ozone</span></div>
        <div class="pollutant-item"><b>${a.current?.nitrogen_dioxide?.toFixed(0) ?? '—'}</b><span>NO₂</span></div>
      </div>
    `;
    body.parentElement.appendChild(aqCard);

    const interpretCard = document.createElement('div');
    interpretCard.className = 'card';
    interpretCard.innerHTML = `
      <h2 class="section-title">What this means for you</h2>
      <p style="font-size:14px;line-height:1.6;">${esc(aq.guidance)}</p>
      <p class="muted" style="margin-top:8px;"><b>${esc(aq.who)}.</b> The AQI number is a single score built from whichever pollutant is currently worst — here's what each one below it actually is:</p>
      <div style="margin-top:14px;">
        ${Object.entries(POLLUTANT_GLOSSARY).map(([name,desc]) => `
          <div style="margin-bottom:12px;">
            <div style="font-weight:600;font-size:13.5px;color:var(--sage-700);">${esc(name)}</div>
            <div style="font-size:13px;color:var(--ink-soft);line-height:1.5;">${esc(desc)}</div>
          </div>
        `).join('')}
      </div>
      <p class="muted" style="margin-top:8px;">Weather and pollutant data from Open-Meteo. Specific pollen counts (tree/grass/weed) aren't covered for U.S. locations by this free source — let me know if you'd like to add a dedicated pollen provider later.</p>
    `;
    body.parentElement.appendChild(interpretCard);
  }catch(e){
    body.innerHTML = `<p class="auth-error">Couldn't load conditions right now — check your connection and try again.</p>`;
  }
}
let cycleSelectedDate = todayStr();
const FLOW_OPTIONS = ['none','spotting','light','medium','heavy'];
const SYMPTOM_FIELDS = [
  {key:'breast_pain', label:'Breast pain'},
  {key:'cramps', label:'Cramps'},
  {key:'bloating', label:'Bloating'},
  {key:'headache', label:'Headache'},
  {key:'acne', label:'Acne'},
  {key:'sex_activity', label:'Sexual activity'},
];

function computeCycleStats(logs){
  // logs: array of {date, flow} ascending by date, flow != 'none' marks bleeding days
  const bleedDates = logs.filter(l => l.flow && l.flow !== 'none').map(l => l.date).sort();
  if(bleedDates.length === 0) return null;
  // find period start dates: a bleed date not immediately preceded by another bleed date
  const starts = [];
  bleedDates.forEach(d => {
    const prev = addDays(d, -1);
    if(!bleedDates.includes(prev)) starts.push(d);
  });
  const lastStart = starts[starts.length-1];
  let avgCycleLen = null;
  if(starts.length >= 2){
    const gaps = [];
    for(let i=1;i<starts.length;i++){
      gaps.push((new Date(starts[i]) - new Date(starts[i-1])) / 86400000);
    }
    avgCycleLen = Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length);
  }
  const today = todayStr();
  const currentDay = Math.floor((new Date(today) - new Date(lastStart))/86400000) + 1;
  const predictedNext = avgCycleLen ? addDays(lastStart, avgCycleLen) : null;
  return {lastStart, avgCycleLen, currentDay, predictedNext, totalCyclesTracked: starts.length};
}

      <h2 class="section-title">Recent history</h2>
      ${allLogs.slice().reverse().slice(0,14).length ? allLogs.slice().reverse().slice(0,14).map(cycleHistoryRow).join('') : `<p class="empty-state">No entries yet.</p>`}
    </div>

    <div class="card" id="correlation-card">

  `;

  let selectedFlow = todayLog.flow || 'none';

  $('#cyc-next').onclick = () => { if(!isFuture){ cycleSelectedDate = addDays(cycleSelectedDate,1); renderCycle(panel); } };
  const jumpBtn = $('#cyc-jump');
  if(jumpBtn) jumpBtn.onclick = () => { cycleSelectedDate = todayStr(); renderCycle(panel); };
